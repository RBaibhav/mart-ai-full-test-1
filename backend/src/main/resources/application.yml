server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: shopsmart-ai
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopsmart}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ShopSmart AI configuration
shopsmart:
  jwt:
    secret: "shopsmart-super-secret-jwt-key-2026-minimum-256-bits-length-secure-key"
    expiration-ms: 86400000 # 24 hours
  admin-email: "admin@shopsmart.com"
  model-name: ${SHOPSMART_MODEL_NAME:shopsmart-gpt-4o-mini}
