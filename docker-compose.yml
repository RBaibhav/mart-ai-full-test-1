version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shopsmart-postgres
    environment:
      POSTGRES_DB: shopsmart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopsmart"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
